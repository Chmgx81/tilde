name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Run GoReleaser
        run: go run github.com/goreleaser/goreleaser/v2@latest release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
