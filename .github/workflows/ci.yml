name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so BuildVersion()'s `git describe --tags` sees the
          # release tags; a shallow checkout makes it report a bare SHA and
          # fails the version tests in internal/update.
          fetch-depth: 0
      - name: Install sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: go build -o /tmp/tilde-smoke .
      - name: Cross-compile (darwin)
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - name: Smoke
        run: /tmp/tilde-smoke --help
      - name: Version smoke
        run: |
          test -n "$(/tmp/tilde-smoke --version)"
          test -n "$(/tmp/tilde-smoke -version)"

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Check docs links
        working-directory: website
        run: npm run check-links
      - name: Build site
        working-directory: website
        run: npm run build

  govulncheck:
    runs-on: ubuntu-latest
    # Strict scan, but tolerate offline mirrors: failures never block
    # the build (see Note step); real findings must still be fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: ~/go/bin/govulncheck ./...
      - name: Note
        if: failure()
        run: echo "govulncheck failed — re-run if this is a network/mirror outage; otherwise treat findings as blocking and fix them"

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Race tests
        run: go test -race -count=1 ./internal/agent/ ./internal/tools/

  release-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Snapshot (skip SBOM when syft is missing)
        run: |
          extra=""
          command -v syft >/dev/null 2>&1 || extra="--skip=sbom"
          go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean --skip=publish $extra
