# tilde policies — loaded at startup from the project root (missing file =
# built-in defaults). Tiers are checked in order; deny beats ask beats
# allow, always — including against --yes and Auto mode.
# `deny`/`ask`/`allow` name tools here; shell destructive shapes
# (rm -rf, sudo, curl, git force-push…) deny in code via shellDeny and
# always win, even when shell_command itself is only ask-tier.
# The bwrap sandbox stays the hard backstop behind all of this.
# `allow_net` (optional) lists hostnames web_fetch may retrieve without
# the session-wide TILDE_ALLOW_NET=1 opt-in, e.g.
# allow_net:
#   - example.com
# Exact hostname match; SSRF guards still refuse private/loopback targets.
# `deny_paths` (optional) denies file-tool paths by glob BEFORE tiers —
# a match denies even with --yes. Single * stays in one segment.
# Applies to read/write/edit `path`, grep `dir`, glob `pattern`.
# deny_paths:
#   - "**/secrets/**"
#   - "*.key"
# `shell_poll` is intentionally unlisted: status/log polls read free like
# the allow tier, while the kill action is Plan-blocked in code
# (internal/policy + internal/mode) regardless of tiers — listing it
# here would wrongly gate the read-only polls.
deny: []
ask:
  - write_file
  - edit_file
  - shell_command
  - git_worktree_add
  - git_worktree_remove
  - mcp_call
  - todo_write
  - ask_user
  - web_fetch
  - web_search
  - web_shot
  - spawn_work
  - apply_work
  - discard_work
  - memory
  - remember
allow:
  - read_file
  - grep
  - glob
  - git_status
  - git_diff
  - git_worktree_list
  - load_skill
  - mcp_list
  - spawn_explore
  - symbol_search
  - diagnose
  - save_plan
