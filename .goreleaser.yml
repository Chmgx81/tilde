version: 2
project_name: tilde

# Release automation (P1-E): tag vX.Y.Z → archives + checksums + SBOM.
# Version comes from the git tag; update.go's Version const stays the
# human-readable source of truth inside the binary.

before:
  hooks:
    - go mod download

builds:
  - id: tilde
    main: .
    binary: tilde
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]

archives:
  - id: tilde
    # .Tag keeps the leading v so
    # `install.sh --from-release=v0.10.0` and get.sh resolve
    # tilde_v0.10.0_<os>_<arch>.<ext> on the release page. macOS ships zip.
    name_template: "tilde_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
    format_overrides:
      - goos: darwin
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SBOM via syft. If syft is unavailable, disable gracefully with:
#   goreleaser release --snapshot --clean --skip=publish --skip=sbom
# (the CI dry-run job does exactly this fallback automatically).
sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github

release:
  draft: false
  prerelease: auto
