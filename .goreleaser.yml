version: 2
project_name: tilde

# Release automation (P1-E): tag vX.Y.Z → archives + checksums + SBOM.
# Version comes from the git tag; update.go's Version const stays the
# human-readable source of truth inside the binary.

before:
  hooks:
    - go mod download

builds:
  - id: tilde
    main: .
    binary: tilde
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]

archives:
  - id: tilde
    # .Tag keeps the leading v so install.sh --from-release=v0.9.0
    # resolves tilde_v0.9.0_linux_amd64.tar.gz on the release page.
    name_template: "tilde_{{ .Tag }}_linux_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SBOM via syft. If syft is unavailable, disable gracefully with:
#   goreleaser release --snapshot --clean --skip=publish --skip=sbom
# (the CI dry-run job does exactly this fallback automatically).
sboms:
  - artifacts: archive

changelog:
  sort: asc
  use: github

release:
  draft: false
  prerelease: auto
